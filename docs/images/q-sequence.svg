<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 860" role="img" aria-labelledby="qSeqTitle qSeqDesc">
  <title id="qSeqTitle">kdb/q live sequence</title>
  <desc id="qSeqDesc">You start the tickerplant and the realtime process. krakentool publishes each event with .kt.ingest. The tickerplant fans .kt.on and the realtime process inserts the row.</desc>
  <defs>
    <marker id="qSeqArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#1b2430"/>
    </marker>
    <style>
      .ink { fill: #1b2430; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
      .muted { fill: #52606d; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
      .teal { fill: #0f6e56; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
      .life { stroke: #c5ced6; stroke-width: 1.25; stroke-dasharray: 4 4; }
      .msg { fill: none; stroke: #1b2430; stroke-width: 1.5; }
      .ret { fill: none; stroke: #1b2430; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .frame { fill: #f3f7f5; stroke: #0f6e56; stroke-width: 1.25; stroke-dasharray: 5 4; }
      .note { fill: #ffffff; stroke: #d5dde6; }
    </style>
  </defs>
  <rect width="1040" height="860" fill="#f7f8fa" rx="16"/>
  <text class="ink" x="32" y="40" font-size="20" font-weight="650">Live publish sequence</text>
  <text class="muted" x="32" y="64" font-size="13">Solid arrows are calls. Dashed arrows are replies. The script name comes before -p.</text>

  <rect x="48" y="88" width="110" height="40" rx="8" fill="#1b2430"/>
  <text x="103" y="113" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="650" font-family="Segoe UI, Helvetica, Arial, sans-serif">You</text>
  <rect x="230" y="88" width="160" height="40" rx="8" fill="#0f6e56"/>
  <text x="310" y="113" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="650" font-family="Segoe UI, Helvetica, Arial, sans-serif">krakentool</text>
  <rect x="470" y="88" width="200" height="40" rx="8" fill="#1a4f8b"/>
  <text x="570" y="113" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="650" font-family="Segoe UI, Helvetica, Arial, sans-serif">tick.q :5010</text>
  <rect x="760" y="88" width="200" height="40" rx="8" fill="#3d4a57"/>
  <text x="860" y="113" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="650" font-family="Segoe UI, Helvetica, Arial, sans-serif">rdb.q</text>

  <line class="life" x1="103" y1="128" x2="103" y2="800"/>
  <line class="life" x1="310" y1="128" x2="310" y2="800"/>
  <line class="life" x1="570" y1="128" x2="570" y2="800"/>
  <line class="life" x1="860" y1="128" x2="860" y2="800"/>

  <line class="msg" x1="111" y1="176" x2="562" y2="176" marker-end="url(#qSeqArrow)"/>
  <text class="ink" x="336" y="168" text-anchor="middle" font-size="12">q kdb/tick.q -p 5010</text>
  <line class="ret" x1="562" y1="214" x2="111" y2="214" marker-end="url(#qSeqArrow)"/>
  <text class="ink" x="336" y="206" text-anchor="middle" font-size="12">listening</text>

  <line class="msg" x1="111" y1="262" x2="852" y2="262" marker-end="url(#qSeqArrow)"/>
  <text class="ink" x="480" y="254" text-anchor="middle" font-size="12">q kdb/rdb.q localhost:5010</text>
  <line class="msg" x1="868" y1="310" x2="578" y2="310" marker-end="url(#qSeqArrow)"/>
  <text class="ink" x="723" y="302" text-anchor="middle" font-size="12">.kt.sub all seven tables</text>
  <line class="ret" x1="578" y1="348" x2="868" y2="348" marker-end="url(#qSeqArrow)"/>
  <text class="ink" x="723" y="340" text-anchor="middle" font-size="12">subscription stored</text>

  <line class="msg" x1="111" y1="396" x2="302" y2="396" marker-end="url(#qSeqArrow)"/>
  <text class="ink" x="206" y="388" text-anchor="middle" font-size="12">--q localhost:5010</text>
  <line class="msg" x1="318" y1="444" x2="562" y2="444" marker-end="url(#qSeqArrow)"/>
  <text class="ink" x="440" y="436" text-anchor="middle" font-size="12">open IPC session</text>
  <line class="ret" x1="562" y1="482" x2="318" y2="482" marker-end="url(#qSeqArrow)"/>
  <text class="ink" x="440" y="474" text-anchor="middle" font-size="12">session accepted</text>

  <rect class="frame" x="168" y="514" width="820" height="196" rx="10"/>
  <text class="teal" x="184" y="538" font-size="12" font-weight="650">loop  each market or account event</text>
  <line class="msg" x1="318" y1="576" x2="562" y2="576" marker-end="url(#qSeqArrow)"/>
  <text class="ink" x="440" y="568" text-anchor="middle" font-size="12">.kt.ingest JSON</text>
  <line class="msg" x1="578" y1="624" x2="852" y2="624" marker-end="url(#qSeqArrow)"/>
  <text class="ink" x="715" y="616" text-anchor="middle" font-size="12">.kt.on table, row</text>
  <rect class="note" x="620" y="648" width="300" height="44" rx="8"/>
  <text class="muted" x="770" y="675" text-anchor="middle" font-size="12">rdb inserts the row</text>

  <rect class="note" x="140" y="732" width="760" height="52" rx="8"/>
  <text class="muted" x="520" y="754" text-anchor="middle" font-size="12">Stdout still receives the event, unless --q-only is set.</text>
  <text class="muted" x="520" y="772" text-anchor="middle" font-size="12">feed.q uses the same .kt.ingest call after the pipe closes.</text>
</svg>
